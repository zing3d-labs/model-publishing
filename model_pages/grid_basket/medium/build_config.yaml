# Grid Basket -- Medium (5x5x5) print profile.
# Model-level config (project identity, source, templates) lives in
# ../model.yaml, shared with small/ and large/.

variants:
  medium_5x5x5:
    name: "Medium Basket"
    description: "Mid-size 5x5x5 basket suitable for tools, electronics, or general organization."
    parameters:
      Basket_X_Units: 5
      Basket_Y_Units: 5
      Basket_Z_Units: 5
      # Pinned explicitly to the .scad file's own current defaults so a
      # future default change upstream can't silently alter what ships --
      # same reasoning as opengrid_beam's Corner_1/Corner_2 pinning. Only one
      # of the 3 axes should be "Extended" (see the comment in
      # grid_basket.scad) since all 3 beams meet at each corner.
      Beam_Corners_X: "Extended"
      Beam_Corners_Y: "Flush"
      Beam_Corners_Z: "Flush"
    # How this one variant is split for printing -- six plates, rendered by
    # driving Render_Plate in mw_grid_basket.scad. Separate from variants:
    # on purpose: a variant is a thing a user picks and carries copy into the
    # description, a plate is only a print job. The deliverable is the packed
    # multi-plate dist/grid_basket_medium/grid_basket_medium.3mf, so the STLs
    # below are the intermediates it is packed from and no per-variant 3MF
    # output is declared.
    plates: [1, 2, 3, 4, 5, 6]
    outputs:
      - format: "stl"
        filename: "grid_basket_medium_5x5x5.stl"

project:
  # Live profile "5x5x5 Basket" on model 2505078.
  makerworld_profile_id: 2758823

# Image generation settings
images:
  defaults:
    resolution: [1920, 1080]
    background: "white"
    colorscheme: "Nature"

  # Applied on top of variant parameters for all image renders
  # mw_grid_basket.scad renders the assembly at Render_Plate 0 (its default,
  # and what the plate renders above override per plate), so an image only has
  # to ask for the basket un-exploded.
  parameter_overrides:
    Explosion_distance: 0

  views:
    - variant: "medium_5x5x5"
      shots:
        - name: "hero"
          camera:
            position: [230, 230, 300]
            look_at: [0, 0, 70]
          filename: "medium_5x5x5_hero.png"
        - name: "side"
          camera:
            position: [-500, 0, 70]
            look_at: [0, 0, 70]
          filename: "medium_5x5x5_side.png"
