# OpenGrid Beam Build Configuration -- Full (6.8mm) thickness only.
# Lengths 2-8 units, Flush/1-Extended/2-Extended corner styles (21 variants,
# under Bambu Studio's 36-plate-per-3mf limit). Lite thickness is a separate
# print profile -- see ../opengrid_beam_lite/build_config.yaml -- because
# combining both would exceed the plate limit (42 variants total).

project:
  name: "openGrid Beam"
  makerworld_url: "https://makerworld.com/en/models/2402751-opengrid-beam"
  makerworld_profile_id: 2633738
  collection: "opengrid"
  description: "Structural beam that combines the openGrid connector with a beam to join tiles at 90-degree angles. Build baskets, shelving, and complex modular structures."
  version: "1.0.0"
  author: "Jonathan Huizingh"
  license: "CC BY-NC-SA 4.0"

source:
  input_file: "../../models/opengrid/parts/opengrid_beam.scad"
  libraries:
    - "BOSL2/"
    - "QuackWorks/"

variants:
  # Full thickness (6.8mm) variants -- both corners Flush (original look)
  full_2u:
    name: "Full 2-Unit Beam"
    description: "6.8mm thickness, 2 units long"
    parameters:
      Units: 2
      Grid_Version: "Full"
      Corner_1: "Flush"
      Corner_2: "Flush"
    outputs:
      - format: "stl"
        filename: "beam_full_2u.stl"

  full_3u:
    name: "Full 3-Unit Beam"
    description: "6.8mm thickness, 3 units long"
    parameters:
