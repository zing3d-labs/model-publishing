# OpenGrid Beam -- model-level configuration, shared across both print
# profiles (Full/Lite thickness). See full/ and lite/ for the profile-
# specific build_config.yaml files (variants, makerworld_profile_id).
#
# Paths here are relative to a PROFILE subdirectory (e.g. full/), one level
# deeper than this file, since that's where they're actually resolved from.

project:
  name: "openGrid Beam"
  makerworld_url: "https://makerworld.com/en/models/2402751-opengrid-beam"
  collection: "opengrid"
  description: "Structural beam that combines the openGrid connector with a beam to join tiles at 90-degree angles. Build baskets, shelving, and complex modular structures."
  version: "1.0.0"
  author: "Jonathan Huizingh"
  license: "CC BY-NC-SA 4.0"

source:
  input_file: "../../../models/opengrid/parts/opengrid_beam.scad"
  libraries:
    - "BOSL2/"
    - "QuackWorks/"

# Cross-profile list used by the "Available Print Profiles" description
# section -- independent of each profile's own build variants.
profiles:
  - name: "Full (6.8mm)"
    description: "Standard thickness, matches Full-thickness openGrid tiles."
  - name: "Lite (4mm)"
    description: "Thinner profile, matches Lite-thickness openGrid tiles."

# Modular template system
templates:
  base_template: "base_template.md"
  template_root: "../../../templates"

  sites:
    makerworld:
      base_template: "makerworld_base.md"
      output_file: "descriptions/makerworld_description.txt"
      model_type: "remix"
      category: "Organizers"
      tags: "opengrid, beam, connector, modular, grid, organization, parametric, customizer"
      source_urls:
        - "https://makerworld.com/en/models/1179191-opengrid-wall-desk-mounting-framework-ecosystem"

# Build pipeline settings (shared across all profiles)
build:
  output_directory: "dist/"
  clean_before_build: true

  openscad:
    executable: "openscad"
    timeout: 300
    additional_flags: []

  render:
    timeout: 120
    additional_flags: ["--render"]
