# OpenGrid Beam -- Lite (4mm) thickness print profile.
# Lengths 2-8 units, Flush/1-Extended/2-Extended corner styles (21 variants).
# Same underlying model/page as ../full/ (see ../model.yaml) but a SEPARATE
# print profile -- Bambu Studio's 36-plate-per-3mf limit meant Full+Lite
# together (42 variants) couldn't ship as one profile.
#
# makerworld_profile_id 3442733 ("Lite Print Settings") published 2026-07-16
# via `scripts/makerworld_update.py new-profile opengrid_beam/lite`.

project:
  makerworld_profile_id: 3442733

variants:
  # Lite thickness (4mm) variants -- both corners Flush (original look)
  lite_2u:
    name: "Lite 2-Unit Beam"
    description: "4mm thickness, 2 units long"
    parameters:
      Units: 2
      Grid_Version: "Lite"
      Corner_1: "Flush"
      Corner_2: "Flush"
    outputs:
