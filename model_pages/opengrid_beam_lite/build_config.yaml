# OpenGrid Beam Lite Build Configuration -- Lite (4mm) thickness only.
# Lengths 2-8 units, Flush/1-Extended/2-Extended corner styles (21 variants).
# Same underlying model/page as ../opengrid_beam/ (makerworld_url below) but
# a SEPARATE print profile -- Bambu Studio's 36-plate-per-3mf limit meant
# Full+Lite together (42 variants) couldn't ship as one profile.
#
# makerworld_profile_id 3442733 ("Lite Print Settings") published 2026-07-16
# via `scripts/makerworld_update.py new-profile opengrid_beam_lite`.

project:
  name: "openGrid Beam Lite"
  makerworld_url: "https://makerworld.com/en/models/2402751-opengrid-beam"
  makerworld_profile_id: 3442733
  collection: "opengrid"
  description: "Structural beam that combines the openGrid connector with a beam to join tiles at 90-degree angles. Lite (4mm) thickness. Build baskets, shelving, and complex modular structures."
  version: "1.0.0"
  author: "Jonathan Huizingh"
  license: "CC BY-NC-SA 4.0"

source:
  input_file: "../../models/opengrid/parts/opengrid_beam.scad"
  libraries:
    - "BOSL2/"
    - "QuackWorks/"

variants:
  # Lite thickness (4mm) variants -- both corners Flush (original look)
  lite_2u:
    name: "Lite 2-Unit Beam"
    description: "4mm thickness, 2 units long"
    parameters:
      Units: 2
      Grid_Version: "Lite"
      Corner_1: "Flush"
      Corner_2: "Flush"
    outputs:
